[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Приймач заявок → Telegram. Токен бота — у змінних оточення сайту
# (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID), не в репозиторії.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA-фолбек
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Медіа стабільні за іменами — кешуємо надовго
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
